name: CI

# macOS runners bill at 10x the minutes of Linux ones — the paths-ignore below skips
# the whole workflow for doc/config-only changes (the common case for this repo), and
# concurrency cancels a PR's stale runs the moment a new push supersedes them, so you're
# never paying for two sets of macOS runners on the same PR at once.
on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation-packages:
    name: swift test (${{ matrix.package }})
    runs-on: macos-14
    timeout-minutes: 15
    strategy:
      matrix:
        package: [OpenRosaKit, ProjectSettingsKit]
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/cache@v4
        with:
          path: Packages/${{ matrix.package }}/.build
          key: spm-${{ runner.os }}-${{ matrix.package }}-${{ hashFiles(format('Packages/{0}/Package.swift', matrix.package)) }}
      - name: swift test
        working-directory: Packages/${{ matrix.package }}
        run: swift test

  ios-packages:
    name: xcodebuild test (${{ matrix.package }})
    runs-on: macos-14
    timeout-minutes: 20
    strategy:
      matrix:
        package: [ODKWebEngine, ODKCollectUI]
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/cache@v4
        with:
          path: |
            Packages/${{ matrix.package }}/.build
            ~/Library/Developer/Xcode/DerivedData
          key: xcode-${{ runner.os }}-${{ matrix.package }}-${{ hashFiles(format('Packages/{0}/Package.swift', matrix.package)) }}
      - name: Pick an available iOS simulator
        id: simulator
        run: |
          set -euo pipefail
          NAME=$(xcrun simctl list devices available iOS -j \
            | jq -r '.devices | to_entries | map(select(.key | contains("iOS"))) | sort_by(.key) | last.value | map(select(.name | startswith("iPhone"))) | first.name')
          if [ -z "$NAME" ] || [ "$NAME" = "null" ]; then
            echo "::error::No available iPhone iOS simulator found"
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
      - name: xcodebuild test
        working-directory: Packages/${{ matrix.package }}
        run: |
          xcodebuild test \
            -scheme ${{ matrix.package }} \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.name }}"

  app-build:
    name: Build the app (xcodegen + xcodebuild)
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: xcode-${{ runner.os }}-app-${{ hashFiles('project.yml', 'Packages/*/Package.swift') }}
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: |
          cp Config.xcconfig.example Config.xcconfig
          xcodegen generate
      - name: Pick an available iOS simulator
        id: simulator
        run: |
          set -euo pipefail
          NAME=$(xcrun simctl list devices available iOS -j \
            | jq -r '.devices | to_entries | map(select(.key | contains("iOS"))) | sort_by(.key) | last.value | map(select(.name | startswith("iPhone"))) | first.name')
          if [ -z "$NAME" ] || [ "$NAME" = "null" ]; then
            echo "::error::No available iPhone iOS simulator found"
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
      - name: Build
        run: |
          xcodebuild build \
            -project ODKCollect.xcodeproj \
            -scheme ODKCollect \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.name }}"
