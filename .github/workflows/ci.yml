name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation-packages:
    name: swift test (${{ matrix.package }})
    runs-on: macos-14
    strategy:
      matrix:
        package: [OpenRosaKit, ProjectSettingsKit]
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: swift test
        working-directory: Packages/${{ matrix.package }}
        run: swift test

  ios-packages:
    name: xcodebuild test (${{ matrix.package }})
    runs-on: macos-14
    strategy:
      matrix:
        package: [ODKWebEngine, ODKCollectUI]
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Pick an available iOS simulator
        id: simulator
        run: |
          set -euo pipefail
          NAME=$(xcrun simctl list devices available iOS -j \
            | python3 -c "
import json, sys
data = json.load(sys.stdin)
for runtime, devices in data['devices'].items():
    if 'iOS' not in runtime:
        continue
    for d in devices:
        if d['name'].startswith('iPhone'):
            print(d['name'])
            sys.exit(0)
sys.exit(1)
")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
      - name: xcodebuild test
        working-directory: Packages/${{ matrix.package }}
        run: |
          xcodebuild test \
            -scheme ${{ matrix.package }} \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.name }}"

  app-build:
    name: Build the app (xcodegen + xcodebuild)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Pick an available iOS simulator
        id: simulator
        run: |
          set -euo pipefail
          NAME=$(xcrun simctl list devices available iOS -j \
            | python3 -c "
import json, sys
data = json.load(sys.stdin)
for runtime, devices in data['devices'].items():
    if 'iOS' not in runtime:
        continue
    for d in devices:
        if d['name'].startswith('iPhone'):
            print(d['name'])
            sys.exit(0)
sys.exit(1)
")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
      - name: Build
        run: |
          xcodebuild build \
            -project ODKCollect.xcodeproj \
            -scheme ODKCollect \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.name }}"
